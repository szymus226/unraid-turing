name: wydanie
# Obraz w rejestrze GitHub (GHCR) tylko z tagu wydania v*, np. v0.2.0.
# Aktualizator homelabbera pobiera z niego dodatek „Ekran LCD”.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  obraz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-inter
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - id: wersja
        run: echo "wersja=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/unraid-lcd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Unraid LCD
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WERSJA=${{ steps.wersja.outputs.wersja }}
