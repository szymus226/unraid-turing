<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unraid LCD</title>
<style>
/* Układ: lewy panel nawigacji (ciemniejszy niż treść) + obszar roboczy z kartami; na telefonie nawigacja jako pasek u góry. */
:root{
  --bg:#0b0f19;--nav-bg:#060a14;--karta:#161c2a;--linia:#283042;--tekst:#e8ecf4;--szary:#8c96aa;
  --ok:#34c778;--uwaga:#f5b428;--alarm:#f04646;--akcent:#4696ff;--akcent-tlo:#16284a;--ok-tlo:#16341f;--uwaga-tlo:#3a2f10;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"JetBrains Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:14px/1.45 var(--font);background:var(--bg);color:var(--tekst);display:flex;min-height:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--akcent);outline-offset:2px}
nav{width:224px;flex:none;background:var(--nav-bg);padding:14px 10px;border-right:1px solid var(--linia);display:flex;flex-direction:column;gap:2px;padding-left:max(10px,env(safe-area-inset-left,0px))}
nav h1{font-size:16px;margin:4px 8px 14px;display:flex;gap:8px;align-items:center}
nav button.poz{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;color:var(--szary);background:none;border:0;text-align:left;cursor:pointer;width:100%}
nav button.poz:hover{background:var(--karta);color:var(--tekst)}
nav button.poz.on{background:var(--karta);color:var(--tekst)}
nav .ik{width:18px;text-align:center}
nav .stan{margin-top:18px;padding:10px;border-radius:8px;background:var(--karta);font-size:12px;color:var(--szary);display:grid;gap:4px}
nav .jezyk{margin-top:auto;display:flex;gap:4px;padding:8px}
.przel{background:var(--karta);border:1px solid var(--linia);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--szary)}
.przel.on{background:var(--akcent-tlo);border-color:var(--akcent);color:var(--tekst)}
main{flex:1;min-width:0;padding-block:18px 40px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px))}
.pasek{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pasek h2{font-size:18px;margin:0;flex:1;min-width:160px}
.btn{background:var(--karta);border:1px solid var(--linia);border-radius:6px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.btn:hover{border-color:var(--szary)}
.btn.ikona{padding:6px 9px}
.btn.glowny{background:var(--akcent);border-color:var(--akcent);color:#fff}
.btn.glowny:disabled{opacity:.45;cursor:default}
.btn.usun{color:var(--alarm)}
.siatka{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.dwie{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.karta{background:var(--karta);border:1px solid var(--linia);border-radius:10px;padding:14px;min-width:0}
.karta h3{margin:0 0 10px;font-size:12px;color:var(--szary);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.lcd-ramka{background:#000;border-radius:10px;padding:6px;width:max-content;max-width:100%}
.lcd{width:320px;max-width:100%;aspect-ratio:2/3;display:block;border-radius:4px;transition:filter .2s,transform .3s}
.lcd-podpis{font-size:12px;color:var(--szary);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.wiersz{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--linia);flex-wrap:wrap}
.wiersz:last-child{border:0}
.wiersz .et{flex:1;color:var(--szary);min-width:140px}
.pomoc{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--szary);font-size:10px;color:var(--szary);margin-left:5px;cursor:help;vertical-align:1px}
.kropka{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
input[type=range]{width:170px;accent-color:var(--akcent)}
select,input[type=number],input[type=text],input[type=time]{background:var(--bg);border:1px solid var(--linia);border-radius:6px;padding:5px 8px}
select{max-width:100%}
input[type=checkbox]{accent-color:var(--akcent);width:16px;height:16px}
.karty-wyboru{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kw{position:relative;border:2px solid var(--linia);border-radius:10px;padding:14px 12px 12px;text-align:center;font-weight:600;cursor:pointer;background:var(--bg)}
.kw:hover{border-color:var(--szary)}
.kw.on{border-color:var(--akcent);background:var(--akcent-tlo)}
.kw .odz{position:absolute;top:6px;right:8px;font-size:10px;color:var(--akcent);font-weight:600}
.kw .opis{display:block;font-weight:400;font-size:12px;color:var(--szary);margin-top:4px}
.mini{width:28px;height:42px;border:2px solid var(--szary);border-radius:3px;margin:0 auto 8px;position:relative}
.mini::after{content:"";position:absolute;left:50%;bottom:-8px;width:6px;height:6px;margin-left:-3px;background:var(--szary);border-radius:1px}
.mini.odw{transform:rotate(180deg)}
.mini.poz-p{transform:rotate(-90deg);margin:7px auto 15px}
.mini.poz-l{transform:rotate(90deg);margin:7px auto 15px}
.lcd.poziomo{width:480px;aspect-ratio:3/2}
#obrot{grid-template-columns:repeat(2,minmax(0,1fr))}
.el.wyl{opacity:.55;border-style:dashed}
.el.wyl:hover{background:var(--bg)}
.el.wyl .el-nazwa{text-decoration:line-through}
.el-oko{padding:4px 6px;flex:none}
.el-styl{margin-left:auto}
.el-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:6px}
.el{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--bg);border:1px solid var(--linia);border-radius:10px;padding:12px;transition:border-color .15s,background .15s}
.el:hover{border-color:var(--akcent);background:var(--akcent-tlo)}
.el-ik{grid-row:span 2;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--akcent-tlo);color:var(--akcent)}
.el-ik svg{width:24px;height:24px}
.el-gora{display:flex;align-items:center;gap:8px;min-width:0}
.el-nazwa{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el-styl{flex:none;font-size:11px;color:var(--szary);border:1px solid var(--linia);border-radius:9px;padding:1px 8px}
.el select{width:100%;font-size:13px;padding:6px 8px}
.ustawienia-ekranu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.ustawienia-ekranu .pole{background:var(--bg);border:1px solid var(--linia);border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ustawienia-ekranu .pole label,.ustawienia-ekranu .pole>span:first-child{color:var(--szary);font-size:13px}
.pasek-stanu{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ps{display:inline-flex;align-items:center;gap:6px;background:var(--karta);border:1px solid var(--linia);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--szary)}
.ps b{color:var(--tekst);font-weight:600}
.miniatury{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.min{width:112px;flex:none;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.min img{width:112px;border-radius:4px;border:2px solid var(--linia);display:block}
.min.on img{border-color:var(--akcent)}
.min.wyl img{opacity:.35}
.min .opis{display:flex;justify-content:space-between;font-size:12px;color:var(--szary);margin-top:4px;gap:4px}
.min .opis span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.min .opis span:last-child{flex:none}
.tabela{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;border-bottom:1px solid var(--linia);text-align:left;vertical-align:middle}
th{color:var(--szary);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.wart{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;width:118px}
.wart input{width:72px;text-align:right;font-variant-numeric:tabular-nums}
.wart .jedn{width:22px;text-align:left;color:var(--szary)}
.wart .tekst-wart{width:72px;text-align:right;padding-right:9px}
th.num .kropka{vertical-align:1px}
td.srodek,th.srodek{text-align:center}
#alarmy th.num,#alarmy td.num{text-align:center}
#alarmy .wart{width:100px;justify-content:flex-start}
#alarmy .wart .tekst-wart{text-align:center;padding-right:0}
.znacznik{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--ok-tlo);color:var(--ok);white-space:nowrap;display:inline-block}
.znacznik.u{background:var(--uwaga-tlo);color:var(--uwaga)}
.znacznik.a{background:#3a1414;color:var(--alarm)}
.znacznik.s{background:var(--linia);color:var(--szary)}
.log{font:12px/1.7 var(--mono);color:var(--szary)}
.log .WARNING{color:var(--uwaga)}
.log .ERROR{color:var(--alarm)}
.licznik{font-size:12px;color:var(--szary)}
.licznik.pelny{color:var(--uwaga)}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--karta);border:1px solid var(--ok);color:var(--tekst);padding:10px 14px;border-radius:8px;box-shadow:0 6px 24px #0008;display:flex;gap:8px;align-items:center}
.niezapisane{font-size:12px;color:var(--uwaga);display:flex;align-items:center;gap:6px}
.dialog-tlo{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--karta);border:1px solid var(--linia);border-radius:12px;padding:18px;max-width:420px;width:100%}
.dialog h3{margin:0 0 8px;font-size:16px}
.dialog p{margin:0 0 14px;color:var(--szary)}
.dialog .przyciski{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.motyw-probka{height:64px;border-radius:6px;margin-bottom:8px;border:1px solid var(--linia)}
.baner-krytyczny{background:#3a1416;border:1px solid var(--alarm);color:var(--tekst);border-radius:8px;padding:10px 12px;margin:-4px 0 14px}
.baner-krytyczny strong{color:var(--alarm);margin-right:6px}
.btn:disabled{opacity:.4;cursor:default}
.licznik-nav{margin-left:auto;background:var(--alarm);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.kr-pusty{display:flex;gap:12px;align-items:center;color:var(--szary);padding:6px 0}
.kr-pusty .ok{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ok-tlo);color:var(--ok);font-weight:700;flex:none}
.kr-alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linia)}
.kr-alert:last-child{border:0}
.kr-alert .pas{align-self:stretch;border-radius:2px;background:var(--alarm)}
.kr-alert.wyc .pas{background:var(--szary)}
.kr-alert .tyt{font-weight:600}
.kr-alert .op{font-size:12px;color:var(--szary)}
.kr-alert .akcje{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.przelacznik{position:relative;display:inline-block;width:40px;height:22px;flex:none;vertical-align:middle}
.przelacznik input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:1}
.przelacznik span{position:absolute;inset:0;border-radius:11px;background:var(--linia);transition:background .15s}
.przelacznik span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.przelacznik input:checked+span{background:var(--akcent)}
.przelacznik input:checked+span::after{transform:translateX(18px)}
.przelacznik input:focus-visible+span{outline:2px solid var(--akcent);outline-offset:2px}
.przelacznik input:disabled+span{opacity:.35}
.przelacznik input:disabled{cursor:default}
.kr-alert .akcje label.tekst{font-size:13px;color:var(--szary)}
td .op{display:block;font-size:12px;color:var(--szary)}
.link{background:none;border:0;padding:0;color:var(--akcent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
@media (max-width:760px){
  body{flex-direction:column}
  nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--linia);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:4px;align-items:center}
  nav h1,nav .stan{display:none}
  nav button.poz{width:auto;white-space:nowrap}
  nav .jezyk{margin:0 0 0 auto;padding:0}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .siatka,.dwie{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.lcd{transition:none}}
</style>
</head>
<body>
<nav aria-label="Panel">
  <h1><span class="kropka" id="kropka-stanu" style="background:var(--ok)"></span>Unraid LCD</h1>
  <button class="poz" data-s="podglad"><span class="ik">▣</span><span data-t="Podgląd|Preview"></span></button>
  <button class="poz" data-s="ekrany"><span class="ik">▦</span><span data-t="Ekrany i układy|Screens & layouts"></span></button>
  <button class="poz" data-s="dane"><span class="ik">☷</span><span data-t="Dyski i kontenery|Disks & containers"></span></button>
  <button class="poz" data-s="krytyczne"><span class="ik">◉</span><span data-t="Alerty krytyczne|Critical alerts"></span><span class="licznik-nav" id="licznik-nav" hidden></span></button>
  <button class="poz" data-s="alarmy"><span class="ik">⚠</span><span data-t="Progi alarmowe|Alert thresholds"></span></button>
  <button class="poz" data-s="urzadzenie"><span class="ik">⇄</span><span data-t="Urządzenie USB|USB device"></span></button>
  <button class="poz" data-s="motywy"><span class="ik">◐</span><span data-t="Motywy|Themes"></span></button>
  <button class="poz" data-s="logi"><span class="ik">≡</span><span data-t="Logi|Logs"></span></button>
  <div class="stan">
    <div><span class="kropka" id="kropka-boczna" style="background:var(--ok)"></span> <span id="stan-boczny"></span></div>
    <div>Turing 3,5" · rev A</div>
    <div data-t="Tylko sieć domowa|Home network only"></div>
  </div>
  <div class="jezyk" role="group" aria-label="Język / Language">
    <button class="przel" data-j="pl">PL</button><button class="przel" data-j="en">EN</button>
  </div>
</nav>

<main>
<div class="pasek-stanu" role="status" id="pasek-stanu"></div>
<div class="baner-krytyczny" id="blad-polaczenia" hidden><strong data-t="Brak połączenia z aplikacją|No connection to the app"></strong> <span data-t="Panel ponawia co 2 s.|The panel retries every 2 s."></span></div>

<!-- PODGLĄD -->
<section id="podglad">
  <div class="pasek"><h2 data-t="Podgląd|Preview"></h2>
    <button class="btn ikona" id="poprz" data-tip="Poprzedni ekran|Previous screen">◀</button>
    <button class="btn ikona" id="pauza" data-tip="Wstrzymaj przełączanie|Pause rotation">⏸</button>
    <button class="btn ikona" id="nast" data-tip="Następny ekran|Next screen">▶</button>
    <button class="btn" id="alert-testowy" data-t="Test alertu krytycznego (60 s)|Critical alert test (60 s)"></button>
  </div>
  <div class="baner-krytyczny" id="baner-krytyczny" hidden style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:220px"><strong data-t="Alert krytyczny|Critical alert"></strong> <span id="baner-tekst"></span></span><button class="btn" id="baner-wycisz" data-t="Wycisz do rozwiązania|Mute until resolved"></button><button class="btn" id="baner-zmien" data-t="Zmień w: Alerty krytyczne|Change in: Critical alerts"></button></div>
  <div class="siatka">
    <div>
      <div class="lcd-ramka"><img class="lcd" id="lcd-glowny" alt=""></div>
      <div class="lcd-podpis"><span id="podpis-ekranu"></span><span id="podpis-czasu"></span></div>
    </div>
    <div style="display:grid;gap:14px;min-width:0">
      <div class="karta"><h3 data-t="Wyświetlanie|Display"></h3>
        <div class="wiersz"><label class="et" for="jasnosc" data-t="Jasność|Brightness"></label><input type="range" id="jasnosc" min="5" max="100" value="60"><span id="jasnosc-wart" style="width:42px;text-align:right"></span></div>
        <div class="wiersz"><label class="et" for="odswiezanie"><span data-t="Odświeżanie danych|Data refresh"></span><span class="pomoc" data-tip="Częściej oznacza większe obciążenie CPU i USB. Pełny obraz na tym ekranie trwa około 1,8 s.|More often means more CPU and USB load. A full frame takes about 1.8 s on this display.">?</span></label>
          <select id="odswiezanie"><option value="1">1 s</option><option value="2">2 s</option><option value="5">5 s</option><option value="10">10 s</option></select></div>
        <div class="wiersz"><label class="et" for="przelaczanie" data-t="Przełączanie ekranów|Screen rotation"></label>
          <select id="przelaczanie"><option value="0" data-t="wyłączone|off"></option><option value="10" data-t="według czasu ekranów|by each screen's time"></option></select></div>
        <div class="wiersz"><label class="et" for="jezyk-ekranu" data-t="Język ekranu LCD|LCD language"></label>
          <select id="jezyk-ekranu"><option value="pl">Polski</option><option value="en">English</option></select></div>
        <div class="wiersz"><label class="et" for="noc"><span data-t="Wyłącz ekran nocą|Turn off at night"></span><span class="pomoc" data-tip="Alert krytyczny włącza ekran także w tych godzinach.|A critical alert turns the display on during these hours too.">?</span></label>
          <input type="checkbox" id="noc"><input type="time" id="noc-od" value="23:00" data-tip="od|from"><span>–</span><input type="time" id="noc-do" value="07:00" data-tip="do|to"></div>
        <div class="wiersz"><label class="et" for="naglowek-polaczenia"><span data-t="Połączenia w nagłówku|Connections in the header"></span><span class="pomoc" data-tip="Ikony internetu, VPN, tunelu, Bluetooth i wysyłania przed godziną na każdym ekranie. Dane wysyła pulpit homelabbera; bez niego nagłówek wygląda jak dotąd.|Internet, VPN, tunnel, Bluetooth and casting icons before the clock on every screen. The homelabber desktop sends the data; without it the header looks as before.">?</span></label>
          <label class="przelacznik"><input type="checkbox" id="naglowek-polaczenia" checked><span></span></label></div>
      </div>
      <div class="karta"><h3 data-t="Obrót ekranu|Rotation"></h3>
        <div class="karty-wyboru" role="radiogroup" id="obrot">
          <div class="kw" role="radio" tabindex="0" data-v="pionowo"><span class="odz" data-t="domyślny|default"></span><div class="mini"></div><span data-t="Pionowo|Portrait"></span><span class="opis" data-t="kabel na dole|cable at the bottom"></span></div>
          <div class="kw" role="radio" tabindex="0" data-v="pionowo_odwrocony"><div class="mini odw"></div><span data-t="Pionowo, odwrócony|Portrait, flipped"></span><span class="opis" data-t="kabel na górze|cable at the top"></span></div>
          <div class="kw" role="radio" tabindex="0" data-v="poziomo"><div class="mini poz-p"></div><span data-t="Poziomo|Landscape"></span><span class="opis" data-t="kabel z prawej|cable on the right"></span></div>
          <div class="kw" role="radio" tabindex="0" data-v="poziomo_odwrocony"><div class="mini poz-l"></div><span data-t="Poziomo, odwrócony|Landscape, flipped"></span><span class="opis" data-t="kabel z lewej|cable on the left"></span></div>
        </div></div>
    </div>
  </div>
</section>

<!-- EKRANY -->
<section id="ekrany" hidden>
  <div class="pasek"><h2 data-t="Ekrany i układy|Screens & layouts"></h2>
    <span class="niezapisane" id="niezap-ekrany" hidden>● <span data-t="Niezapisane zmiany|Unsaved changes"></span></span>
    <button class="btn glowny zapisz" data-grupa="ekrany" disabled data-t="Zapisz|Save"></button></div>
  <div class="karta" style="margin-bottom:14px"><h3 data-t="Kolejność, czas i widoczność|Order, time and visibility"></h3>
    <div class="miniatury" id="miniatury"></div></div>
  <div class="siatka">
    <div class="lcd-ramka"><img class="lcd" id="lcd-edytor" alt=""></div>
    <div class="karta" style="min-width:0"><h3 id="tytul-elementow"></h3>
      <div class="ustawienia-ekranu">

  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-tytul">
    <h3 id="dialog-tytul" data-t="Niezapisane zmiany|Unsaved changes"></h3>
    <p data-t="Na tej stronie są niezapisane zmiany. Co z nimi zrobić?|This page has unsaved changes. What should happen to them?"></p>
    <div class="przyciski"><button class="btn" id="d-anuluj" data-t="Zostań|Stay"></button><button class="btn" id="d-odrzuc" data-t="Odrzuć|Discard"></button><button class="btn glowny" id="d-zapisz" data-t="Zapisz|Save"></button></div>
  </div>
</div>
<script>
// Panel Unraid LCD: ten sam układ co zatwierdzona makieta, dane i zapis przez API aplikacji.
'use strict';
const $ = id => document.getElementById(id);
let J = 'pl';
try { J = localStorage.getItem('lcd-jezyk-panelu') || ''; } catch (e) { J = ''; }
const T = s => { const [pl, en] = s.split('|'); return J === 'en' ? (en ?? pl) : pl; };
const liczba = (v, m = 1) => (+v).toLocaleString(J === 'en' ? 'en-US' : 'pl-PL', { maximumFractionDigits: m });
const esc = s => String(s ?? '').replace(/[&<>"']/g, z => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[z]));

// --- stan panelu ---
let U = null;              // ustawienia z serwera
let S = null;              // ostatni /api/stan
let REJESTR = [];          // opis ekranów i ich elementów
let ekranyRob = [];        // kopia robocza ekranów (do zapisu)
let DYSKI = [], KONT = [], wybraneDyski = new Set(), wybraneKont = new Set();
let wybranyEdytor = 0, sekcja = 'podglad', czekajacaSekcja = null, wersjaMiniatur = 0;
const brudne = { ekrany: false, dane: false, alarmy: false, krytyczne: false };
let rodzajeRob = {};       // kopia robocza rodzajów alertów (do zapisu)
let ostatnieAktywne = '';  // żeby nie przerysowywać listy, gdy nic się nie zmieniło

const PROGI = [
  ['cpu_temp', 'Temperatura CPU|CPU temperature', '°C'], ['hdd_temp', 'Temperatura dysku HDD|HDD temperature', '°C'],
  ['ssd_temp', 'Temperatura dysku SSD/NVMe|SSD/NVMe temperature', '°C'], ['cpu', 'Obciążenie CPU|CPU load', '%'],
  ['ram', 'RAM|RAM', '%'], ['swap', 'SWAP|Swap', '%'], ['array', 'Zajętość array|Array usage', '%'],
  ['kontener_stop', 'Zatrzymany wybrany kontener|Selected container stopped', '', 'always', null],
  ['dysk_awaria', 'Błąd SMART lub dysk wyłączony z array|SMART error or disabled disk', '', null, 'always'],
];
// Rodzaje alertów krytycznych: te same klucze co RODZAJE_ALERTOW w aplikacji.
const RODZAJE = [
  ['dysk', 'Dysk poza array|Disk out of the array', 'dysk wyłączony, brakujący lub emulowany|disk disabled, missing or emulated'],
  ['smart', 'Błąd SMART|SMART failure', 'test SMART nieudany|SMART test failed'],
  ['array', 'Array zatrzymany|Array stopped', 'array nie działa|the array is not running'],
  ['parity', 'Błędy parity|Parity errors', 'błędy w ostatniej kontroli parity|errors in the last parity check'],
  ['prog', 'Próg alarmu|Alarm threshold', 'temperatura CPU i dysków, CPU, RAM, SWAP, zajętość array (wartości w „Progi alarmowe”)|CPU and disk temperature, CPU, RAM, swap, array usage (values in “Alert thresholds”)'],
  ['unraid', 'Powiadomienie Unraida|Unraid notification', 'powiadomienia o poziomie „alert”|notifications with level “alert”'],
  ['pulpit', 'Pulpit homelabbera|Homelabber desktop', 'np. tunel, DNS, zasilanie; lista ustawiana w pulpicie, gdy powstanie dodatek|e.g. tunnel, DNS, power; list set in the desktop once the add-on exists'],
];
const NAZWA_TESTU = 'Test alertu krytycznego|Critical alert test';
const nazwaRodzaju = k => k === 'test' ? T(NAZWA_TESTU) : T((RODZAJE.find(r => r[0] === k) || [k, k])[1]);
const przelacznik = (id, wl, etykieta, wylaczony) =>
  `<label class="przelacznik" title="${esc(etykieta)}"><input type="checkbox" id="${id}" ${wl ? 'checked' : ''} ${wylaczony ? 'disabled' : ''} aria-label="${esc(etykieta)}"><span></span></label>`;
const WARUNKI = {
  parity: 'tylko gdy trwa kontrola parity|only while parity check runs',
  speedtest: 'tylko gdy speedtest jest włączony w „Dyski i kontenery”|only when speed test is on in “Disks & containers”',
};
const ZRODLA = {
  unraid: ['Unraid', '/var/local/emhttp → /host/emhttp'],
  docker: ['Docker', '/var/lib/docker/containers → /host/docker/containers'],
  czujniki: ['Czujniki temperatury|Temperature sensors', '/sys (hwmon)'],
};

async function api(sciezka, opcje = {}) {
  const o = { ...opcje, headers: { ...(opcje.body ? { 'Content-Type': 'application/json' } : {}), ...(opcje.headers || {}) } };
  const r = await fetch(sciezka, o);
  if (!r.ok) {
    let opis = r.status + ' ' + r.statusText;
    try { const j = await r.json(); if (j.detail) opis = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) { /* brak treści */ }
    throw new Error(opis);
  }
  const typ = r.headers.get('content-type') || '';
  return typ.includes('json') ? r.json() : r.text();
}
async function ustaw(zmiany, komunikat) {
  try {
    U = await api('/api/ustawienia', { method: 'PUT', body: JSON.stringify(zmiany) });
    if (komunikat) toast(T(komunikat));
    return true;
  } catch (e) { toast(T('Nie udało się zapisać: |Could not save: ') + e.message, true); return false; }
}

// --- tłumaczenie ---
function tlumacz() {
  document.documentElement.lang = J;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = T(e.dataset.t));
  document.querySelectorAll('[data-ph]').forEach(e => e.placeholder = T(e.dataset.ph));
  document.querySelectorAll('[data-tip]').forEach(e => { e.title = T(e.dataset.tip); e.setAttribute('aria-label', T(e.dataset.tip)); });
  document.querySelectorAll('[data-j]').forEach(b => b.classList.toggle('on', b.dataset.j === J));
  rysujWszystko();
}

// --- obrazy ekranów ---
const poziomo = () => U && (U.orientacja === 'poziomo' || U.orientacja === 'poziomo_odwrocony');
function adresEkranu(klucz, ukryte) {
  const p = new URLSearchParams({ ukryte: (ukryte || []).join(','), v: wersjaMiniatur });
  return `/api/ekran/${encodeURIComponent(klucz)}.png?${p}`;
}
function opisEkranu(klucz) { return REJESTR.find(e => e.klucz === klucz) || { klucz, nazwa: klucz + '|' + klucz, elementy: [], warunek: null }; }

// --- podgląd ---
function rysujPodglad() {
  if (!U || !S) return;
  document.querySelectorAll('.lcd').forEach(e => e.classList.toggle('poziomo', !!poziomo()));
  const img = $('lcd-glowny');
  const opis = opisEkranu(S.ekran);
  img.alt = T(opis.nazwa);
  img.style.filter = S.noc ? 'brightness(.12)' : `brightness(${0.35 + 0.65 * (S.jasnosc || 0) / 100})`;
  img.style.transform = U.orientacja === 'pionowo_odwrocony' ? 'rotate(180deg)' : '';
  const alarmy = S.alerty.filter(a => a.poziom === 'alarm');
  $('baner-krytyczny').hidden = !alarmy.length;
  if (alarmy.length) {
    const a = alarmy[0];
    const skutki = [S.przypiety ? T('Ekran Alerty jest przypięty, przełączanie wstrzymane|The Alerts screen is pinned, rotation paused') : '',
      U.krytyczne_jasnosc ? T('jasność 100%|brightness 100%') : ''].filter(Boolean).join(', ');
    $('baner-tekst').textContent = `${a.tytul}${a.opis ? ': ' + a.opis : ''}${alarmy.length > 1 ? ` (+${alarmy.length - 1})` : ''}.${skutki ? ' ' + skutki[0].toUpperCase() + skutki.slice(1) + '.' : ''}`;
  }
  ['poprz', 'pauza', 'nast'].forEach(id => $(id).disabled = S.przypiety);
  const testowy = S.alerty.some(a => a.id === 'zew:test-panelu');
  $('alert-testowy').textContent = testowy ? T('Usuń alert testowy|Clear test alert') : T('Test alertu krytycznego (60 s)|Critical alert test (60 s)');
  if (S.przypiety) {
    $('podpis-ekranu').textContent = T('Alerty · przypięte|Alerts · pinned');
    $('podpis-czasu').textContent = U.krytyczne_jasnosc ? T('jasność 100%|brightness 100%') : '';
  } else {
    const n = S.kolejka.length;
    $('podpis-ekranu').textContent = `${n ? S.indeks + 1 : 1} / ${n || 1} · ${T(opis.nazwa)}`;
    $('podpis-czasu').textContent = S.noc ? T('ekran wyłączony na noc|display off for the night')
      : S.pauza ? T('wstrzymane|paused')
      : S.nastepny_za_s != null ? T('następny za|next in') + ' ' + Math.ceil(S.nastepny_za_s) + ' s' : '';
  }
  $('pauza').textContent = S.pauza ? '▶︎▶︎' : '⏸';
  $('pauza').dataset.tip = S.pauza ? 'Wznów przełączanie|Resume rotation' : 'Wstrzymaj przełączanie|Pause rotation';
  $('pauza').title = T($('pauza').dataset.tip);
}
function odswiezObraz() {
  if (sekcja !== 'podglad' || document.hidden) return;
  const img = $('lcd-glowny');
  const nowy = new Image();
  nowy.onload = () => { img.src = nowy.src; };
  nowy.src = '/api/podglad.png?t=' + Date.now();
}
function rysujUstawieniaPodgladu() {
  if (!U) return;
  $('jasnosc').value = U.jasnosc; $('jasnosc-wart').textContent = U.jasnosc + '%';
  $('odswiezanie').value = String(Math.round(U.odswiezanie_s));
  $('przelaczanie').value = U.przelaczanie_s > 0 ? '10' : '0';
  $('jezyk-ekranu').value = U.jezyk;
  $('noc').checked = U.noc_wl; $('noc-od').value = U.noc_od; $('noc-do').value = U.noc_do;
  $('naglowek-polaczenia').checked = U.naglowek_polaczenia !== false;

async function zapisz(g) {
  let zmiany = {};
  if (g === 'ekrany') zmiany = { ekrany: ekranyRob };
  if (g === 'dane') {
    const st = $('speedtest').checked ? +$('speedtest-co').value : 0;
    zmiany = {
      sortuj_awarie: aktywnaKarta('kolejnosc') !== 'lista',
      dyski: DYSKI.length ? DYSKI.filter(d => wybraneDyski.has(d.nazwa)).map(d => d.nazwa) : U.dyski,
      kontenery: KONT.length ? KONT.filter(k => wybraneKont.has(k.nazwa)).map(k => k.nazwa) : U.kontenery,
      speedtest_co_h: st, pogoda_wl: $('pogoda').value === '1',
    };
    if (DYSKI.length && zmiany.dyski.length === DYSKI.length) zmiany.dyski = null;   // wszystkie, także nowe dyski
    const miejsce = $('pogoda-miejsce').value.trim();
    if (zmiany.pogoda_wl && (miejsce !== U.pogoda_miejsce || U.pogoda_lat == null)) {
      if (!miejsce) { toast(T('Wpisz miejscowość dla pogody.|Enter a town for the weather.'), true); return false; }
      let wyniki;
      try { wyniki = await api('/api/pogoda/szukaj?' + new URLSearchParams({ q: miejsce, jezyk: J })); }
      catch (e) { toast(T('Wyszukiwarka miejscowości nie odpowiada: |Town search is not responding: ') + e.message, true); return false; }
      if (!wyniki.length) { toast(T('Nie znaleziono miejscowości: |Town not found: ') + miejsce, true); return false; }
      const w = wyniki[0];
      Object.assign(zmiany, { pogoda_miejsce: w.nazwa + (w.region ? ', ' + w.region : ''), pogoda_lat: w.lat, pogoda_lon: w.lon });
    }
  }
  if (g === 'alarmy') {
    const progi = {};
    PROGI.forEach(([klucz], i) => {
      const [u, a] = U.progi[klucz] || [null, null];
      const wartosc = (n, dom) => { const p = $(`prog-${i}-${n}`); return p && p.value !== '' ? +p.value : dom; };
      progi[klucz] = [wartosc('u', u), wartosc('a', a), $(`prog-${i}-s`).checked];
    });
    zmiany = { progi };
  }
  if (g === 'krytyczne') {
    zmiany = { rodzaje_alertow: rodzajeRob, krytyczne_przypnij: $('kr-przypnij').checked, krytyczne_jasnosc: $('kr-jasnosc').checked, krytyczne_ramka: $('kr-naglowek').checked };
  }
  if (!(await ustaw(zmiany, 'Zapisano|Saved'))) return false;
  wyczysc(g);
  if (g === 'ekrany') ekranyRob = JSON.parse(JSON.stringify(U.ekrany));
  if (g === 'dane') { await wczytajDane(); }
  if (g === 'alarmy') rysujProgi();
  if (g === 'krytyczne') rysujKrytyczne();
  return true;
}
function toast(t, blad) {
  $('toast-tekst').textContent = t;
  $('toast').style.borderColor = blad ? 'var(--alarm)' : 'var(--ok)';
  $('toast').firstElementChild.textContent = blad ? '!' : '✓';
  $('toast').firstElementChild.style.color = blad ? 'var(--alarm)' : 'var(--ok)';
  $('toast').hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').hidden = true, blad ? 5000 : 2200);
}

// --- nawigacja między sekcjami ---
function pokaz(s) {
  if (brudne[sekcja] && s !== sekcja) { czekajacaSekcja = s; $('dialog').hidden = false; $('d-zapisz').focus(); return; }
  sekcja = s;
  document.querySelectorAll('main section').forEach(e => e.hidden = e.id !== s);
  document.querySelectorAll('nav .poz').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  if (location.hash.slice(1) !== s) history.replaceState(null, '', '#' + s);
  if (s === 'ekrany') { wersjaMiniatur++; rysujEdytor(); }
  if (s === 'dane' && !brudne.dane) wczytajDane();
  if (s === 'urzadzenie') wczytajUrzadzenia();
  if (s === 'logi') rysujLogi();
  if (s === 'krytyczne') rysujKrytyczne();
  if (s === 'podglad') odswiezObraz();
}
$('d-anuluj').onclick = () => { $('dialog').hidden = true; czekajacaSekcja = null; };
$('d-odrzuc').onclick = () => { odrzuc(sekcja); $('dialog').hidden = true; pokaz(czekajacaSekcja); };
$('d-zapisz').onclick = async () => { if (await zapisz(sekcja)) { $('dialog').hidden = true; pokaz(czekajacaSekcja); } };
window.addEventListener('beforeunload', e => { if (Object.values(brudne).some(Boolean)) { e.preventDefault(); e.returnValue = ''; } });

// --- karty wyboru ---
function zaznaczKarte(id, v) { $(id).querySelectorAll('.kw').forEach(k => { k.classList.toggle('on', k.dataset.v === v); k.setAttribute('aria-checked', k.dataset.v === v); }); }
function aktywnaKarta(id) { const k = $(id).querySelector('.kw.on'); return k && k.dataset.v; }
function radio(id, fn) {
  $(id).querySelectorAll('.kw').forEach(k => {
    const wybierz = () => { if (k.classList.contains('on')) return; zaznaczKarte(id, k.dataset.v); fn(k.dataset.v); };
    k.onclick = wybierz;
    k.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); wybierz(); } };
  });
}

// --- zdarzenia ---
document.querySelectorAll('nav .poz').forEach(b => b.onclick = () => pokaz(b.dataset.s));
document.querySelectorAll('[data-j]').forEach(b => b.onclick = () => {
  J = b.dataset.j;
  try { localStorage.setItem('lcd-jezyk-panelu', J); } catch (e) { /* bez zapamiętania */ }
  tlumacz();
});
document.querySelectorAll('.zapisz').forEach(b => b.onclick = () => zapisz(b.dataset.grupa));
const nawiguj = (akcja, klucz) => api('/api/nawigacja', { method: 'POST', body: JSON.stringify({ akcja, klucz }) }).then(odswiezStan).catch(e => toast(e.message, true));
$('poprz').onclick = () => nawiguj('poprzedni');
$('nast').onclick = () => nawiguj('nastepny');
$('pauza').onclick = () => nawiguj(S && S.pauza ? 'wznow' : 'pauza');
$('alert-testowy').onclick = async () => {
  const testowy = S && S.alerty.some(a => a.id === 'zew:test-panelu');
  try { await api('/api/alert-testowy?jezyk=' + (U ? U.jezyk : 'pl'), { method: testowy ? 'DELETE' : 'POST' }); } catch (e) { toast(e.message, true); }
  setTimeout(odswiezStan, 400);
};
let opoznienieJasnosci = null;
$('jasnosc').oninput = () => {
  $('jasnosc-wart').textContent = $('jasnosc').value + '%';
  clearTimeout(opoznienieJasnosci);
  opoznienieJasnosci = setTimeout(() => ustaw({ jasnosc: +$('jasnosc').value }), 250);
};
$('odswiezanie').onchange = () => ustaw({ odswiezanie_s: +$('odswiezanie').value }, 'Zapisano|Saved');
$('przelaczanie').onchange = () => ustaw({ przelaczanie_s: +$('przelaczanie').value }, 'Zapisano|Saved').then(odswiezStan);
$('jezyk-ekranu').onchange = () => ustaw({ jezyk: $('jezyk-ekranu').value }, 'Zapisano|Saved').then(() => { wersjaMiniatur++; if (sekcja === 'ekrany') rysujEdytor(); });
$('noc').onchange = () => ustaw({ noc_wl: $('noc').checked }, 'Zapisano|Saved').then(rysujUstawieniaPodgladu);
$('naglowek-polaczenia').onchange = () => ustaw({ naglowek_polaczenia: $('naglowek-polaczenia').checked }, 'Zapisano|Saved').then(() => { wersjaMiniatur++; odswiezObraz(); });
$('noc-od').onchange = () => ustaw({ noc_od: $('noc-od').value }, 'Zapisano|Saved');
$('noc-do').onchange = () => ustaw({ noc_do: $('noc-do').value }, 'Zapisano|Saved');
$('czas-ekranu').onchange = () => { ekranyRob[wybranyEdytor].czas_s = +$('czas-ekranu').value; oznacz('ekrany'); rysujMiniatury(); };
$('widoczny').onchange = () => { ekranyRob[wybranyEdytor].wl = $('widoczny').checked; oznacz('ekrany'); rysujMiniatury(); };
$('poziom').onchange = rysujLogi;
$('pobierz').onclick = () => { location.href = '/api/logi.txt'; };
$('eksport').onclick = () => { location.href = '/api/motyw/eksport'; };
$('import').onclick = () => $('plik-motywu').click();
$('plik-motywu').onchange = async () => {
  const plik = $('plik-motywu').files[0];
  $('plik-motywu').value = '';
  if (!plik) return;
  let dane;
  try { dane = JSON.parse(await plik.text()); } catch (e) { toast(T('To nie jest plik JSON.|This is not a JSON file.'), true); return; }
  try { U = await api('/api/motyw/import', { method: 'POST', body: JSON.stringify(dane) }); }
  catch (e) { toast(T('Import nieudany: |Import failed: ') + e.message, true); return; }
  ekranyRob = JSON.parse(JSON.stringify(U.ekrany)); wersjaMiniatur++;
  rysujWszystko(); toast(T('Motyw zaimportowany|Theme imported'));
};
$('test').onclick = async () => {
  const w = $('wynik-testu');
  if (U && U.tryb !== 'usb') { w.className = 'znacznik s'; w.textContent = T('Tryb symulacji: brak ekranu do testu|Simulation mode: no display to test'); return; }
  w.className = 'znacznik s'; w.textContent = T('Wysyłam pełną klatkę…|Sending a full frame…');
  try {
    const r = await api('/api/test', { method: 'POST' });
    const czas = new Date().toLocaleTimeString(J === 'en' ? 'en-GB' : 'pl-PL', { hour: '2-digit', minute: '2-digit' });
    if (r.polaczony && r.czas_klatki_s != null) { w.className = 'znacznik'; w.textContent = `OK · ${czas} · ${T('pełna klatka|full frame')} ${liczba(r.czas_klatki_s, 2)} s`; }
    else { w.className = 'znacznik a'; w.textContent = r.blad || T('Nie znaleziono ekranu|Display not found'); }
  } catch (e) { w.className = 'znacznik a'; w.textContent = e.message; }
  odswiezStan();
};
$('port-wybor').onchange = () => ustaw({ port: $('port-wybor').value }, 'Zapisano|Saved');
radio('obrot', v => ustaw({ orientacja: v }, 'Obrót zmieniony|Rotation changed').then(() => { wersjaMiniatur++; rysujPodglad(); if (sekcja === 'ekrany') rysujEdytor(); odswiezStan(); }));
radio('tryb', v => ustaw({ tryb: v }, 'Zapisano|Saved').then(() => { $('wynik-testu').className = 'znacznik s'; $('wynik-testu').textContent = '—'; odswiezStan(); }));
radio('kolejnosc', () => oznacz('dane'));
radio('motyw', v => ustaw({ motyw: v }, 'Motyw ustawiony|Theme set').then(() => { wersjaMiniatur++; odswiezStan(); }));
$('speedtest').onchange = () => { $('speedtest-co').disabled = !$('speedtest').checked; oznacz('dane'); };
$('speedtest-co').onchange = () => oznacz('dane');
$('pogoda').onchange = () => { $('pogoda-miejsce').disabled = $('pogoda').value === '0'; oznacz('dane'); };
$('pogoda-miejsce').oninput = () => oznacz('dane');
['kr-przypnij', 'kr-jasnosc', 'kr-naglowek'].forEach(id => $(id).onchange = () => oznacz('krytyczne'));
$('baner-wycisz').onclick = () => wycisz(S.alerty.filter(a => a.poziom === 'alarm').map(a => a.id), true);
$('baner-zmien').onclick = () => pokaz('krytyczne');
document.querySelectorAll('[data-idz]').forEach(b => b.onclick = () => pokaz(b.dataset.idz));
window.addEventListener('hashchange', () => { const s = location.hash.slice(1); if ($(s) && s !== sekcja) pokaz(s); });

// --- start ---
(async function start() {
  try {
    [U, REJESTR] = await Promise.all([api('/api/ustawienia'), api('/api/ekrany')]);
  } catch (e) {
    $('blad-polaczenia').hidden = false;
    setTimeout(start, 2000);
    return;
  }
  if (J !== 'pl' && J !== 'en') J = U.jezyk === 'en' ? 'en' : 'pl';
  ekranyRob = JSON.parse(JSON.stringify(U.ekrany));
  await odswiezStan();
  tlumacz();
  const s = location.hash.slice(1);
  pokaz($(s) && document.querySelector(`nav [data-s="${s}"]`) ? s : 'podglad');
  setInterval(odswiezStan, 2000);
  setInterval(() => { if (sekcja === 'logi') rysujLogi(); }, 5000);
  setInterval(() => { if (sekcja === 'ekrany' && !document.hidden) { wersjaMiniatur++; rysujEdytor(); } }, 30000);
  requestAnimationFrame(() => window.scrollTo(0, 0));
})();

</script>
</body>
</html>
